<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

        <title>Weekly File Uploader</title>
    </head>

    <body class="bg-dark">
        <!---->
        <!-- Navbar -->

        <nav class="navbar navbar-expand-sm bg-dark-subtle">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Weekly File Uploader</a>

                <div class="ms-auto">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#settingsModal">⚙ Settings</button>
                </div>
            </div>
        </nav>

        <!-- Upload files -->

        

        <!-- Modal -->

        <div class="modal fade" id="settingsModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Settings</h5>

                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label"> Cloudflare Endpoint </label>

                            <input class="form-control" type="text" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label"> Bucket Name </label>

                            <input class="form-control" type="text" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label"> Access Key </label>

                            <input class="form-control" type="text" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label"> Secret Key </label>

                            <input class="form-control" type="password" />
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

                        <button class="btn btn-success">Save</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
